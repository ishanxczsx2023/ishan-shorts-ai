name: Build Ishan AI Shorts APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/IshanShorts-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
            name: IshanShorts-v1.0.1-APK
            path: dist/IshanShorts-v1.0.1.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
            tag_name: v1.0.1
            name: Ishan AI Shorts v1.0.1 (Ultra-Human Voice & 9:16 Shorts Studio)
            body: |
              🚀 **Ishan AI Shorts v1.0.1 Official Android APK**
            
              ### ✨ What's New in v1.0.1:
              - 🎭 **5 Ultra-Human Emotion Styles**: Thoughtful & Deep (দার্শনিক ও বিবেক), Emotional Story (আবেগঘন গল্প), Motivational (উত্তেজক), Cinematic Mystery, Natural Conversational.
              - 🫁 **Human Breathing & Clause Pauses**: 350ms-550ms natural breath silence between thoughts. Zero robotic monotone!
              - 🇧🇩 **Pristine Bengali & English Pronunciation**: Intelligent punctuation normalization preventing blurred or rushed syllables.
              - 💎 **ElevenLabs Cloud Integration**: Optional direct ElevenLabs API key support.
              - 🎙️ **Studio Vocal Mastering**: Warm chest EQ, sibilance de-esser, room ambiance & EBU R128 (-14 LUFS) broadcast loudness.
              - 🎬 **Mathematical Subtitle Sync**: 0% drift Hormozi captions matched to spoken words.
            files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
